[project]
name = "uap-observer"
version = "0.1.0"
description = "Offline stationary sky observation foundation (WP0)"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.10",
    "PyYAML>=6",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "av>=16",
    "scipy>=1.17",
    "websockets>=15",
    "ijson>=3.3",
]
[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.11",
    "mypy>=1.15",
    "types-PyYAML>=6",
    "scipy-stubs>=1.18.1.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["../tests/unit", "../tests/integration"]
[tool.ruff]
line-length = 100
[tool.mypy]
strict = true
[[tool.mypy.overrides]]
module = ["cv2", "yaml"]
ignore_missing_imports = true
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
